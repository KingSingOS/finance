name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full current-main commit SHA already qualified by Run Checks
        type: string
        required: true
      confirm_release:
        description: Owner confirms this exact revision and production release
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: finance-production-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout trusted main release verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - name: Test release denial boundaries
        run: node --test scripts/release-preflight.test.mjs
      - name: Verify exact source qualification and existing production resources
        run: node scripts/release-preflight.mjs
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_CONFIRMED: ${{ inputs.confirm_release }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Checkout verified release revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Install app from reviewed lockfile
        run: pnpm --dir app install --frozen-lockfile
      - name: Install worker from reviewed lockfile
        run: pnpm --dir worker install --frozen-lockfile
      - name: Build production application
        run: pnpm --dir app run build:production
      - name: Deploy exact production configuration
        working-directory: worker
        run: pnpm exec wrangler deploy --config wrangler.production.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
