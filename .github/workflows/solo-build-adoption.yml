name: Solo Build adapter integrity
on:
  pull_request:
    paths: ['.solo-build/**', 'AGENTS.md', '.github/workflows/solo-build-adoption.yml']
  push:
    branches: ["main"]
    paths: ['.solo-build/**', 'AGENTS.md', '.github/workflows/solo-build-adoption.yml']
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -B .solo-build/verify.py
