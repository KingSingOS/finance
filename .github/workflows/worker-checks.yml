name: Worker dependency baseline
on:
  pull_request:
    paths: ['worker/**', '.github/workflows/worker-checks.yml']
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker-checks.yml']
permissions:
  contents: read
jobs:
  frozen-worker-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - name: Frozen standalone Worker dependency install
        id: install
        working-directory: worker
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Worker source and test types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: worker
        run: pnpm run typecheck
      - name: Worker runtime regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: worker
        run: pnpm exec vitest run
        env:
          WRANGLER_SEND_METRICS: 'false'
